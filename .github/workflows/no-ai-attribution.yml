name: no-ai-attribution

# Fails when a commit MESSAGE or author/committer IDENTITY mentions the vendor.
#
# What this guard reads: commit messages and author/committer identity. Nothing
# else. It never opens a file and never inspects a path in the tree, so tracking
# a file such as testing/CLAUDE.md, or a .claude/ ignore entry, is fine and is
# never flagged. That is what "files are out of scope" means.
#
# It does NOT mean a file path is safe to write INSIDE a message. Any occurrence
# in message text counts, including one that happens to be a path: a message
# reading "docs: update testing/CLAUDE.md" fails on purpose. Name the file by
# role instead, e.g. "docs: update the testing instructions file". Commit the
# file freely; just do not spell its name in the message.

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: scan commit messages and identities
        env:
          EV: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          # Actions invokes this with `bash -e`. Combined with pipefail, a grep
          # that matches nothing (exit 1) is the CLEAN case but would abort the
          # script, so the grep-in-assignment below ends with `|| true`.
          set -uo pipefail

          PAT='claude|anthropic'

          if [ "$EV" = "pull_request" ]; then
            base=$(git merge-base "$PR_BASE" "$PR_HEAD" 2>/dev/null || echo "$PR_BASE")
            head="$PR_HEAD"
          elif [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # New branch: only inspect commits not already on another remote ref,
            # so a fresh branch is not judged for the whole repo's history.
            base=""
            head="$PUSH_AFTER"
          else
            base="$PUSH_BEFORE"
            head="$PUSH_AFTER"
          fi

          if [ -n "$base" ]; then
            range=$(git rev-list "$base..$head" 2>/dev/null || echo "")
          else
            range=$(git rev-list "$head" --not --remotes=origin --max-count=200 2>/dev/null || echo "")
          fi

          if [ -z "$range" ]; then
            echo "no new commits to scan"
            exit 0
          fi

          failed=0
          for c in $range; do
            meta=$(git show -s --format='%an <%ae>%n%cn <%ce>%n%B' "$c")
            bad=$(echo "$meta" | grep -inE "$PAT" | head -3 || true)
            if [ -n "$bad" ]; then
              echo "::error::$(git show -s --format='%h %s' "$c")"
              echo "$bad" | sed 's/^/    /'
              failed=1
            fi
          done

          if [ "$failed" -eq 1 ]; then
            echo ""
            echo "Commit messages above reference the vendor. This includes a bare file"
            echo "path such as testing/CLAUDE.md - the file is fine to commit, but its"
            echo "name must not appear in the message. Name it by role instead, e.g."
            echo "\"the testing instructions file\", then amend and force-push."
            exit 1
          fi

          n=$(echo "$range" | grep -c . || true)
          echo "clean - ${n:-0} commit message(s) scanned"
